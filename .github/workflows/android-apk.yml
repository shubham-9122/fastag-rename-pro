name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Android APK
        run: |
          npm run android:sync
          cd android
          ./gradlew assembleDebug

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_path="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk_path"
          cp "$apk_path" fastag-pdf-renamer.apk
          tag="android-apk-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" fastag-pdf-renamer.apk \
            --title "FASTag PDF Renamer Android APK ${GITHUB_RUN_NUMBER}" \
            --notes "Debug-signed APK built from commit ${GITHUB_SHA}. Android may ask you to allow your browser to install apps."
